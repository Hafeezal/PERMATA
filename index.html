<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#087B50">
  <meta name="description" content="PERMATA - Environmental Management System. Dashboard overview, PROPER monitoring, PERCA, pemantauan baku mutu lingkungan kerja, dan tracking temuan.">
  <title>PERMATA · Environmental Management System</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo-permata.svg">
  <link rel="stylesheet" href="global.css">
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="proper.css">
  <link rel="stylesheet" href="criteria.css">
  <link rel="stylesheet" href="audit.css">
  <link rel="stylesheet" href="monitoring.css">
  <link rel="stylesheet" href="ai.css">
  <link rel="stylesheet" href="motion.css">
  <style>
    /* Splash mandiri: tetap rapi walau motion.css belum ikut ter-upload */
    .splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:radial-gradient(circle at 50% 40%,#fff 0%,#eef8f2 100%);transition:opacity .6s ease,visibility .6s ease}
    .splash.is-hiding{opacity:0;visibility:hidden}
    .splash-logo{width:min(460px,70vw);height:auto;max-height:40vh;object-fit:contain}
    .splash-bar{width:160px;height:3px;border-radius:999px;background:rgba(8,123,80,.12);overflow:hidden}
    .splash-bar::after{content:'';display:block;height:100%;width:40%;border-radius:inherit;background:linear-gradient(90deg,#83D94D,#087B50);animation:sp-slide 1.1s ease-in-out infinite}
    @keyframes sp-slide{0%{transform:translateX(-110%)}100%{transform:translateX(300%)}}
    /* Tampilan HP */
    @media (max-width: 760px) {
      html, body { overflow-x: hidden; }
      .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
      .topbar-tools { flex-wrap: wrap; gap: 8px; }
      .topbar-tools .control { flex: 1 1 140px; min-width: 0; }
      .app-footer { flex-wrap: wrap; gap: 6px; }
      .splash-logo { width: 78vw; }
    }  </style>
</head>
<body>
  <div class="splash" id="splash" aria-hidden="true">
    <img class="splash-logo" src="logo-permata.jpg.png" alt="PERMATA">
    <div class="splash-bar"></div>
  </div>
  <aside class="sidebar" id="sidebar" aria-label="Navigasi aplikasi"></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="app-main">
    <img class="bg-landscape" src="assets/bg-landscape.svg" alt="" aria-hidden="true">
    <header class="topbar" id="topbar"></header>
    <main class="view" id="view"></main>
    <footer class="app-footer">
      <span>PERMATA · Environmental Management System</span>
      <span class="sep"></span>
      <span>Prototipe antarmuka</span>
      <span class="demo-chip">
        <i data-lucide="flask-conical"></i>
        Data simulasi
      </span>
    </footer>
  </div>

  <div class="toast-root" aria-live="polite"></div>

  <noscript>
    <div style="padding:24px;font-family:Inter,sans-serif">PERMATA memerlukan JavaScript untuk menampilkan dashboard.</div>
  </noscript>

  <!-- Library Icon & Grafik (CDN Resmi + Fallback Lokal) -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>window.lucide || document.write('<script src="assets/lucide.min.js"><\/script>')</script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>window.Chart || document.write('<script src="assets/chart.umd.min.js"><\/script>')</script>

  <!-- Skrip Sistem PERMATA
       Dimuat berurutan. Mencoba file di folder utama dahulu, lalu folder js/ (jaga-jaga
       jika file ter-upload di salah satu lokasi). -->
  <script>
    (function () {
      var V = '20261125';
      var files = ['data', 'proper-data', 'state', 'readiness', 'components', 'charts', 'navigation',
        'dashboard', 'proper', 'criteria', 'perca', 'monitoring', 'audit', 'ai-rag', 'predictive', 'motion', 'app'];
      var i = 0;
      function next() {
        if (i >= files.length) return;
        var name = files[i++];
        var paths = [name + '.js?v=' + V, 'js/' + name + '.js?v=' + V];
        (function tryLoad(n) {
          var s = document.createElement('script');
          s.src = paths[n];
          s.async = false;
          s.onload = next;
          s.onerror = function () {
            if (n + 1 < paths.length) tryLoad(n + 1);
            else { console.warn('PERMATA: gagal memuat ' + name + '.js'); next(); }
          };
          document.body.appendChild(s);
        })(0);
      }
      next();
    })();
  </script>

  <!-- Diagnostic Helper jika script gagal termuat di hosting/Vercel -->
  <script>
    /* Pengaman splash: selalu hilang setelah halaman termuat */
    (function () {
      var t0 = Date.now();
      function hide() {
        var el = document.getElementById('splash');
        if (!el) return;
        el.classList.add('is-hiding');
        setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 800);
      }
      window.addEventListener('load', function () {
        setTimeout(hide, Math.max(0, 1900 - (Date.now() - t0)));
      });
      setTimeout(hide, 5000);
    })();
  </script>
  <script>
    window.addEventListener('load', function () {
      setTimeout(function () {
        if (!window.PERMATA || !window.PERMATA.nav) {
          var view = document.getElementById('view');
          if (view && view.children.length === 0) {
            view.innerHTML = `
              <div style="max-width:680px;margin:40px auto;padding:28px;background:#ffffff;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,0.08);border-left:5px solid #e11d48;font-family:Inter,system-ui,sans-serif">
                <h3 style="color:#e11d48;margin:0 0 10px;font-size:18px;display:flex;align-items:center;gap:8px">
                  <span style="font-weight:800">!</span> File JavaScript Belum Lengkap di Vercel / GitHub
                </h3>
                <p style="color:#475569;line-height:1.6;font-size:14px;margin-bottom:14px">
                  Fitur dan menu aplikasi tidak dapat ditampilkan karena browser gagal memuat file JavaScript dari folder <strong><code>js/</code></strong>.
                </p>
                <div style="background:#f8fafc;padding:14px 18px;border-radius:8px;font-size:13px;color:#334155;line-height:1.6">
                  <strong>Penyebab &amp; Cara Mengatasi:</strong>
                  <ol style="margin:8px 0 0;padding-left:20px">
                    <li>Buka repository GitHub Anda di <code>github.com</code>.</li>
                    <li>Pastikan folder <strong><code>js</code></strong> dan folder <strong><code>assets</code></strong> ada di repository (bukan hanya file <code>index.html</code> dan <code>.css</code>).</li>
                    <li>Jika folder <strong><code>js</code></strong> belum ada, silakan upload seluruh folder <strong><code>js</code></strong> beserta semua file di dalamnya ke GitHub.</li>
                    <li>Setelah dicommit ke GitHub, Vercel akan otomatis mengupdate websitenya secara langsung.</li>
                  </ol>
                </div>
              </div>`;
          }
        }
      }, 1500);
    });
  </script>
</body>
</html>
